<!DOCTYPE html>
<html lang="es" id="arriba">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TecnoSur Components | Contacto</title>
  <style>
    * { box-sizing: border-box; }
    body { max-width: 960px; margin: 0 auto; padding: 24px; font-family: Arial, sans-serif; color: #172033; background: #f5f7fb; }
    header { display: flex; flex-wrap: wrap; align-items: center; gap: 24px; border-bottom: 1px solid #dbe2ef; margin-bottom: 32px; padding-bottom: 16px; }
    nav a { margin-right: 16px; color: #172033; text-decoration: none; }
    nav a:hover, nav a:focus-visible { color: #1565c0; text-decoration: underline; }
    main { max-width: 680px; padding: 28px; border-radius: 12px; background: #fff; box-shadow: 0 8px 24px rgb(23 32 51 / 8%); }
    h1 { margin-top: 0; color: #124f8c; }
    fieldset { margin: 24px 0; padding: 20px; border: 1px solid #cbd7e6; border-radius: 8px; }
    legend { padding: 0 8px; font-weight: bold; color: #124f8c; }
    label { display: block; margin-top: 14px; font-weight: bold; }
    input, select, textarea { width: 100%; margin-top: 5px; padding: 10px 12px; border: 1px solid #aebdce; border-radius: 6px; font: inherit; }
    textarea { resize: vertical; }
    input:focus, select:focus, textarea:focus { outline: 3px solid rgb(21 101 192 / 22%); border-color: #1565c0; }
    input:invalid:not(:placeholder-shown) { border-color: #b3261e; }
    button { margin-top: 4px; padding: 11px 18px; border: 0; border-radius: 6px; background: #1565c0; color: #fff; font: inherit; font-weight: bold; cursor: pointer; }
    button:hover, button:focus-visible { background: #0d4c91; }
  </style>
</head>
<body>
  <header>
    <a href="index.html"><img src="img/logo.svg" alt="Logotipo de TecnoSur Components" width="200" height="60"></a>
    <nav aria-label="Principal">
      <a href="index.html">Inicio</a><a href="productos.html">Productos</a><a href="precios.html">Precios</a><a href="empresa.html">Empresa</a><a href="contacto.html">Contacto</a><a href="alta.html">Alta</a><a href="privacidad.html">Privacidad</a>
    </nav>
  </header>
  <main>
    <h1>Contacto</h1>
    <p>Envíanos tu consulta y te responderemos lo antes posible.</p>
    <form action="https://httpbin.org/post" method="post">
      <fieldset>
        <legend>Tu consulta</legend>
        <label for="nombre">Nombre</label>
        <input id="nombre" name="nombre" type="text" autocomplete="name" placeholder="Tu nombre" required>
        <label for="correo">Correo electrónico</label>
        <input id="correo" name="correo" type="email" autocomplete="email" placeholder="nombre@ejemplo.com" required>
        <label for="asunto">Asunto</label>
        <input id="asunto" name="asunto" type="text" required>
        <label for="mensaje">Mensaje</label>
        <textarea id="mensaje" name="mensaje" rows="6" required></textarea>
      </fieldset>
      <button type="submit">Enviar consulta</button>
    </form>
  </main>
  <footer><p>&copy; 2026 TecnoSur Components</p></footer>
</body>
</html>
