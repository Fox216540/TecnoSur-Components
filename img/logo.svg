<svg xmlns="http://www.w3.org/2000/svg" width="200" height="60" viewBox="0 0 200 60">
  <title>TecnoSur Components</title>
  <!-- Chip: un cuadrado con "patillas" -->
  <rect x="8" y="12" width="36" height="36" rx="4" fill="#1F4E79"/>
  <rect x="17" y="21" width="18" height="18" rx="2" fill="#FFD27F"/>
  <g stroke="#1F4E79" stroke-width="3">
    <line x1="16" y1="4" x2="16" y2="12"/><line x1="26" y1="4" x2="26" y2="12"/><line x1="36" y1="4" x2="36" y2="12"/>
    <line x1="16" y1="48" x2="16" y2="56"/><line x1="26" y1="48" x2="26" y2="56"/><line x1="36" y1="48" x2="36" y2="56"/>
  </g>
  <!-- Texto del logotipo -->
  <text x="54" y="30" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#1F4E79">TecnoSur</text>
  <text x="54" y="48" font-family="Arial, sans-serif" font-size="12" fill="#C55A11">COMPONENTS</text>
